# Render Blueprint — provisions the Wickets backend with one click.
#
# After pushing this file to GitHub:
#   1. render.com → "New +" → "Blueprint" → connect this repo.
#   2. Render reads this file. It'll ask you for the two "sync: false" vars:
#         DATABASE_URL    -> paste your Neon connection string
#         RAPIDAPI_KEY    -> paste your RapidAPI key
#      JWT_SECRET is auto-generated by Render.
#   3. Click Apply. First build runs `prisma db push` + `seed-prod.ts` so the
#      schema and super-master account are ready before the server boots.
#
# Free plan caveat: the service sleeps after ~15 min idle. First request after
# sleep takes ~30s to wake. Upgrade to Starter ($7/mo) for always-on.

services:
  - type: web
    name: wickets-backend
    runtime: node
    plan: free
    rootDir: backend
    healthCheckPath: /health
    autoDeploy: true

    # Build:
    #   --include=dev  ensures prisma + tsx + typescript are installed (Render
    #                  sets NODE_ENV=production which otherwise skips devDeps).
    #   db push        creates/updates tables on the linked Postgres.
    #   seed-prod      idempotent — only creates the super-master if missing.
    #   build          compiles TS -> dist/
    buildCommand: >-
      npm install --include=dev
      && npx prisma generate
      && npx prisma db push --accept-data-loss --skip-generate
      && npx tsx prisma/seed-prod.ts
      && npm run build

    startCommand: npm start

    envVars:
      - key: NODE_VERSION
        value: "20"
      # Keep the auto-fixture firehose off in prod — same as local.
      - key: DISABLE_AUTO_SLATE
        value: "1"
      # Render auto-generates a secure random value for JWT signing.
      - key: JWT_SECRET
        generateValue: true
      # These two are marked sync:false so Render asks you for them in the
      # dashboard instead of pulling from git (which would leak them).
      - key: DATABASE_URL
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
